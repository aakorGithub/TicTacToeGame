<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: black;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            padding: 10px 0;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(100%, 900px);
            gap: 12px;
            padding: 4px 12px 0;
            color: white;
            font-size: clamp(1.1rem, 1.8vw, 1.6rem);
            font-weight: bold;
            letter-spacing: 0.03em;
            box-sizing: border-box;
        }

        .left-text,
        .right-text {
            flex: 1 1 0;
            min-width: 0;
            text-align: left;
            color: yellowgreen;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: clamp(1.1rem, 1.8vw, 1.6rem);
        }

        .right-text {
            text-align: right;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            width: 78vmin;
            height: 78vmin;
            max-width: 680px;
            max-height: 680px;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
            background-color: #fff;
            font-size: clamp(2rem, 7.5vmin, 5rem);
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cell:nth-child(odd) {
            background-color: #eee;
        }

        .cell:nth-child(even) {
            background-color: #ccc;
        }

        .cell:hover {
            background-color: #f5f5f5;
        }

        .status {
            font-size: 1.1rem;
            color: white;
            margin: 6px 0 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: inline-block;
            min-width: 220px;
            box-sizing: border-box;
        }

        .top-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .mode-controls,
        .difficulty-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-button,
        .difficulty-button {
            padding: 8px 12px;
            font-size: 0.8rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #444;
            color: white;
            transition: background-color 0.3s;
        }

        .mode-button.active,
        .difficulty-button.active {
            background-color: yellowgreen;
            color: #111;
            font-weight: bold;
        }

        .mode-button:hover,
        .difficulty-button:hover {
            background-color: #666;
        }

        .scoreboard {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 6px;
            color: white;
            font-size: 0.9rem;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 8px;
            min-width: 110px;
            text-align: center;
        }

        .score-box strong {
            display: block;
            margin-top: 4px;
            font-size: 1.5rem;
            color: yellowgreen;
        }

        .dragon-wrap {
            position: fixed;
            left: 18px;
            bottom: 18px;
            width: 120px;
            height: 120px;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
        }

        .dragon-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.18));
        }

        .snake-wrap {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 120px;
            height: 120px;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
        }

        .snake-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.18));
        }

        .spade-wrap {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
        }

        .spade-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }

        .gold-ball-wrap {
            position: fixed;
            left: 50%;
            top: 14px;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            pointer-events: none;
            z-index: 1;
        }

        .gold-ball-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 14px rgba(250, 204, 21, 0.7));
        }

        .board-wrapper {
            position: relative;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 12px;
        }

        .overlay.show {
            display: flex;
        }

        .overlay-content {
            color: white;
            padding: 20px;
        }

        .overlay-content h2 {
            margin: 0 0 10px;
            font-size: 2rem;
        }

        .overlay-content p {
            margin: 0 0 15px;
            font-size: 1.1rem;
        }

        .overlay-content button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: yellowgreen;
            color: #111;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
         /* reset hover button here */
        .reset-button {
            margin-top: 8px;
            padding: 8px 16px;
            font-size: 1rem;
            background-color: yellowgreen;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
     
        .reset-button:hover {
            background-color: #7f8f66;
        }

    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="left-text">TIC - TAC - TOE</div>
            <div class="right-text">GAME PLAY</div>
        </div>

        <div class="scoreboard">
            <div class="score-box">Player X<strong id="scoreX">0</strong></div>
            <div class="score-box">Player O<strong id="scoreO">0</strong></div>
        </div>

        <h1 class="status" id="status">Player X's Turn</h1>

        <div class="top-panel">
            <div class="mode-controls" aria-label="Game mode selection">
                <button class="mode-button active" data-mode="2player">Player vs Player</button>
                <button class="mode-button" data-mode="cpu">Player vs Computer</button>
            </div>

            <div class="difficulty-controls" aria-label="Difficulty selection">
                <button class="difficulty-button active" data-difficulty="easy">Easy</button>
                <button class="difficulty-button" data-difficulty="hard">Hard</button>
            </div>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="overlay" id="gameOverlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">Player X Wins!</h2>
                    <p id="overlayText">Press play to start a new round.</p>
                    <button id="playAgainButton" type="button">Play Again</button>
                </div>
            </div>
        </div>

        <button class="reset-button" id="resetButton">Reset Game</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
