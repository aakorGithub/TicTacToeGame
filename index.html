<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: black;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            padding: 10px 0;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(100%, 900px);
            gap: 12px;
            padding: 4px 12px 0;
            color: white;
            font-size: clamp(0.62rem, 1vw, 0.82rem);
            font-weight: bold;
            letter-spacing: 0.03em;
            box-sizing: border-box;
        }

        .left-text,
        .right-text {
            flex: 1 1 0;
            min-width: 0;
            text-align: left;
            color: yellowgreen;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .right-text {
            text-align: right;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            width: 64vmin;
            height: 64vmin;
            max-width: 500px;
            max-height: 500px;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
            background-color: #fff;
            font-size: 6.4vmin;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cell:nth-child(odd) {
            background-color: #eee;
        }

        .cell:nth-child(even) {
            background-color: #ccc;
        }

        .cell:hover {
            background-color: #f5f5f5;
        }

        .status {
            font-size: 1.1rem;
            color: white;
            margin: 6px 0 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: inline-block;
            min-width: 220px;
            box-sizing: border-box;
        }

        .top-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .mode-controls,
        .difficulty-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-button,
        .difficulty-button {
            padding: 8px 12px;
            font-size: 0.8rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #444;
            color: white;
            transition: background-color 0.3s;
        }

        .mode-button.active,
        .difficulty-button.active {
            background-color: yellowgreen;
            color: #111;
            font-weight: bold;
        }

        .mode-button:hover,
        .difficulty-button:hover {
            background-color: #666;
        }

        .scoreboard {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 6px;
            color: white;
            font-size: 0.9rem;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 8px;
            min-width: 110px;
            text-align: center;
        }

        .score-box strong {
            display: block;
            margin-top: 4px;
            font-size: 1.5rem;
            color: yellowgreen;
        }

        .dragon-wrap {
            position: fixed;
            left: 18px;
            bottom: 18px;
            width: 120px;
            height: 120px;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
        }

        .dragon-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.18));
        }

        .snake-wrap {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 120px;
            height: 120px;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
        }

        .snake-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.18));
        }

        .spade-wrap {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
        }

        .spade-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }

        .gold-ball-wrap {
            position: fixed;
            left: 50%;
            top: 14px;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            pointer-events: none;
            z-index: 1;
        }

        .gold-ball-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 14px rgba(250, 204, 21, 0.7));
        }

        .board-wrapper {
            position: relative;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 12px;
        }

        .overlay.show {
            display: flex;
        }

        .overlay-content {
            color: white;
            padding: 20px;
        }

        .overlay-content h2 {
            margin: 0 0 10px;
            font-size: 2rem;
        }

        .overlay-content p {
            margin: 0 0 15px;
            font-size: 1.1rem;
        }

        .overlay-content button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: yellowgreen;
            color: #111;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
         /* reset hover button here */
        .reset-button {
            margin-top: 8px;
            padding: 8px 16px;
            font-size: 1rem;
            background-color: yellowgreen;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
     
        .reset-button:hover {
            background-color: #7f8f66;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="left-text">TIC - TAC - TOE</div>
            <div class="right-text">GAME PLAY</div>
        </div>

        <div class="scoreboard">
            <div class="score-box">Player X<strong id="scoreX">0</strong></div>
            <div class="score-box">Player O<strong id="scoreO">0</strong></div>
        </div>

        <h1 class="status" id="status">Player X's Turn</h1>

        <div class="top-panel">
            <div class="mode-controls" aria-label="Game mode selection">
                <button class="mode-button active" data-mode="2player">Player vs Player</button>
                <button class="mode-button" data-mode="cpu">Player vs Computer</button>
            </div>

            <div class="difficulty-controls" aria-label="Difficulty selection">
                <button class="difficulty-button active" data-difficulty="easy">Easy</button>
                <button class="difficulty-button" data-difficulty="hard">Hard</button>
            </div>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="overlay" id="gameOverlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">Player X Wins!</h2>
                    <p id="overlayText">Press play to start a new round.</p>
                    <button id="playAgainButton" type="button">Play Again</button>
                </div>
            </div>
        </div>

        <button class="reset-button" id="resetButton">Reset Game</button>
    </div>

    <div class="dragon-wrap" aria-hidden="true">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
            <defs>
                <linearGradient id="dragonBody" x1="0%" x2="100%" y1="0%" y2="100%">
                    <stop offset="0%" stop-color="#6ee7b7"/>
                    <stop offset="100%" stop-color="#2563eb"/>
                </linearGradient>
                <linearGradient id="dragonWing" x1="0%" x2="100%" y1="0%" y2="100%">
                    <stop offset="0%" stop-color="#c4b5fd"/>
                    <stop offset="100%" stop-color="#7c3aed"/>
                </linearGradient>
            </defs>

            <path d="M149 122c-9 18-23 31-42 38-22 9-48 8-64-12-17-21-15-51 6-67 18-15 37-19 62-11 20 7 36 27 38 52z" fill="url(#dragonBody)"/>
            <path d="M97 41c-18-28-49-30-71-15 10 15 16 31 16 49 26-7 41-15 55-34z" fill="url(#dragonWing)" opacity="0.9"/>
            <path d="M101 55c-41-21-77-6-95 18 17 7 41 9 67 4 12-2 23-9 28-22z" fill="url(#dragonWing)" opacity="0.7"/>
            <path d="M130 147l44 20c8 4 12 14 8 22l-12 25-29-24 2-18-13-25z" fill="#111827"/>
            <path d="M131 142l29-28 23 11-17 31-35-14z" fill="#e2e8f0"/>
            <circle cx="134" cy="126" r="5" fill="#111827"/>
            <path d="M142 128l19-14 7 9-19 13z" fill="#f8fafc"/>
            <path d="M106 111l-18 26 14 9 18-23z" fill="#0f172a"/>
            <path d="M84 95l-35-8 8 23 28-15z" fill="#a78bfa"/>
            <path d="M117 79l-19 18 14 10 17-17z" fill="#0f172a"/>
        </svg>
    </div>

    <div class="snake-wrap" aria-hidden="true">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
            <defs>
                <linearGradient id="snakeBody" x1="0%" x2="100%" y1="0%" y2="100%">
                    <stop offset="0%" stop-color="#4ade80"/>
                    <stop offset="100%" stop-color="#15803d"/>
                </linearGradient>
            </defs>
            <path d="M32 125c0-19 14-35 33-35h18c17 0 31 14 31 31v18c0 19-15 35-34 35H58c-14 0-26-12-26-27v-22zm40-37c12 0 22 10 22 22v8c0 9-7 16-16 16h-14c-13 0-24-11-24-24v-4c0-10 8-18 18-18h14z" fill="url(#snakeBody)"/>
            <path d="M90 80c9-13 21-20 36-22 11-2 20 2 27 9-11 0-19 4-27 10-11 9-16 20-18 33-13-7-21-18-18-30z" fill="#22c55e"/>
            <path d="M112 100c8-7 19-11 30-12 0 16-6 29-18 38-11 9-23 13-36 15 6-16 14-28 24-41z" fill="#16a34a"/>
            <circle cx="146" cy="91" r="7" fill="#0f172a"/>
            <circle cx="146" cy="91" r="3" fill="#f8fafc"/>
            <path d="M160 96l20-14 10 11-20 17z" fill="#0f172a"/>
            <path d="M90 92l-4 12 15 8 12-10-23-10z" fill="#0f172a"/>
            <path d="M54 143l16 20 12-10-17-21z" fill="#0f172a"/>
            <path d="M77 155l18 18 10-12-18-19z" fill="#0f172a"/>
        </svg>
    </div>
    <script src="game.js"></script>
</body>
</html>
